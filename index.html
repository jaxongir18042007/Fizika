const topicOf=n=>n<=26?1:n<=54?2:n<=84?3:n<=116?4:5;
const $=id=>document.getElementById(id);
let ans={},order=[],pos=0;
try{ans=JSON.parse(localStorage.getItem('cpp_ans')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('cpp_ans',JSON.stringify(ans))}catch(e){}};
function build(shuffle){const t=+$('tp').value;order=D.map((_,i)=>i).filter(i=>!t||topicOf(i+1)===t);

pos=0;draw()}
function stats(){let g=0,b=0;order.forEach(i=>{if(i in ans){ans[i]===D[i].a?g++:b++}});

$('bar').style.width=(order.length?(g+b)/order.length*100:0)+'%';return[g,b]}
function draw(){stats();
$('grid').innerHTML='';order.forEach((i,k)=>{const x=document.createElement('button');x.textContent=i+1;
if(i in ans)x.className=ans[i]===D[i].a?'g':'r';if(k===pos)x.classList.add('cur');x.onclick=()=>{pos=k;draw()};$('grid').appendChild(x)});
const c=$('card');
if(pos>=order.length){const[g,b]=stats(),n=g+b;c.innerHTML='<div class="end"><div class="big">'+g+' / '+order.length+'</div><p>'+(n<order.length?'Hali '+(order.length-n)+' ta savol javobsiz qoldi.':'Test yakunlandi.')+'</p></div>';return}
const i=order[pos],q=D[i];
c.innerHTML='<div class="tag">// mavzu '+topicOf(i+1)+' · savol #'+(i+1)+'</div>';
const p=document.createElement('p');p.className='q';p.textContent=q.q;c.appendChild(p);
if(q.c){const pr=document.createElement('pre');pr.textContent=q.c;c.appendChild(pr)}
q.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';
b.innerHTML='<span class="l">'+'ABCD'[k]+'</span><span class="t"></span><span class="m"></span>';
b.querySelector('.t').textContent=t;
const done=i in ans;if(done){b.disabled=true;
if(k===q.a){b.classList.add('ok');b.querySelector('.m').textContent='✔'}
else if(k===ans[i]){b.classList.add('bad');b.querySelector('.m').textContent='✖'}}
b.onclick=()=>{if(i in ans)return;ans[i]=k;save();draw()};c.appendChild(b)})}
$('nx').onclick=()=>{if(pos<order.length){pos++;draw();scrollTo(0,0)}};
$('pv').onclick=()=>{if(pos>0){pos--;draw();scrollTo(0,0)}};

$('gr').onclick=()=>$('grid').classList.toggle('on');
